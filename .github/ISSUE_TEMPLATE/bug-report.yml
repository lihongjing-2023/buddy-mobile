name: 🐛 Bug Report
description: 提交一个 Bug 报告
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请填写以下信息以帮助我们快速定位问题。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 在「设置」页面查看版本号
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: 设备型号、操作系统版本、Expo Go 版本
      placeholder: "e.g. iPhone 15, iOS 17.5, Expo Go 2.32"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请清晰描述如何复现这个问题
      placeholder: |
        1. 打开应用
        2. 导入账号
        3. 点击...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 如有错误日志或截图，请粘贴在此
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索过现有 Issue，没有发现类似问题
          required: true
        - label: 我已确认这是应用本身的 Bug，而非 API 或网络问题
          required: true
