name: 💡 Feature Request
description: 提出一个新功能建议
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请描述你的想法和需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能要解决什么问题？你的使用场景是什么？
      placeholder: 我经常遇到...，我希望应用能...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望这个功能如何实现？有什么参考吗？
      placeholder: 建议添加一个...功能，可以在...页面展示

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有其他方式可以实现同样的效果？
      placeholder: 目前我是通过...来临时解决

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已确认这是新功能，而非 Bug 报告
          required: true
