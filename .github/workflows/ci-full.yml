name: CI Full

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: true
        default: true
        type: boolean
      build_armeabi_v7a:
        description: 'Build 32-bit APK (armeabi-v7a)'
        required: true
        default: true
        type: boolean
      bump_version:
        description: '递增版本号 (取消勾选可重新构建当前版本)'
        required: true
        default: true
        type: boolean
  
  # 定时触发：每天北京时间0点(UTC 16:00)检查前一天是否有更新
  schedule:
    - cron: '0 16 * * *'
  
  # PR时只运行质量检查，不构建APK
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check dependencies (expo install --check)
        run: npm run check-deps

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Export web (dry-run)
        run: npx expo export --platform web --output dist --dump-sourcemap false || true

  build-android:
    name: Build Android APK (Local)
    runs-on: ubuntu-latest
    # 手动触发 或 定时触发时检查是否需要构建
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_android == true) ||
      (github.event_name == 'schedule' && 
       github.event.schedule == '0 16 * * *')
    permissions:
      contents: write

    steps:
      - name: Check if build is needed
        id: check_build
        if: github.event_name == 'schedule'
        run: |
          # 获取 main 分支最新 commit SHA
          LATEST_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r '.sha')
          echo "Latest commit on main: $LATEST_SHA"

          # 获取最新 Release 对应的 tag，再取该 tag 指向的 commit SHA
          LATEST_RELEASE_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // empty')
          
          if [ -z "$LATEST_RELEASE_TAG" ]; then
            echo "No existing release found, need to build"
            echo "need_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest release tag: $LATEST_RELEASE_TAG"
          RELEASE_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$LATEST_RELEASE_TAG" | jq -r '.object.sha // empty')

          # 如果 tag 指向的是 annotated tag，需要解引用到 commit
          if [ -n "$RELEASE_SHA" ]; then
            TAG_TYPE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/tags/$RELEASE_SHA" | jq -r '.object.type // empty' 2>/dev/null || echo "")
            if [ "$TAG_TYPE" = "commit" ]; then
              RELEASE_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/git/tags/$RELEASE_SHA" | jq -r '.object.sha')
            fi
          fi

          echo "Latest release commit: $RELEASE_SHA"

          if [ "$LATEST_SHA" = "$RELEASE_SHA" ]; then
            echo "Latest release is up-to-date with main, skipping build"
            echo "need_build=false" >> $GITHUB_OUTPUT
            exit 78  # GitHub Actions 特殊退出码，表示跳过
          else
            echo "New commits found since last release, need to build"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Configure git for version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        run: |
          # schedule 触发或手动勾选 bump_version 时递增版本号；手动取消勾选时跳过
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.bump_version }}" = "true" ]; then
            echo "Bumping patch version..."
            npm version patch -m "chore: bump version to %s"
            NEW_VERSION=$(node -p "require('./package.json').version")
            node -e "const f='app.json'; const c=JSON.parse(require('fs').readFileSync(f,'utf8')); c.version='$NEW_VERSION'; require('fs').writeFileSync(f, JSON.stringify(c, null, 2)+'\n');"
            git push --follow-tags
          else
            echo "Skipping version bump, using current version..."
            NEW_VERSION=$(node -p "require('./package.json').version")
            if ! git tag -l "v$NEW_VERSION" | grep -q .; then
              git tag "v$NEW_VERSION"
              git push origin "v$NEW_VERSION"
            fi
          fi
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          build-tools: '34.0.0'
          ndk: '25.2.9519653'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/notifications
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Enable ABI split in build.gradle
        working-directory: android
        run: |
          if [ "${{ inputs.build_armeabi_v7a || 'true' }}" = "true" ]; then
            ABI_INCLUDE='"arm64-v8a", "armeabi-v7a"'
            echo "Building both arm64-v8a and armeabi-v7a"
          else
            ABI_INCLUDE='"arm64-v8a"'
            echo "Building arm64-v8a only"
          fi
          sed -i "/^android {/a\    splits {\n        abi {\n            enable true\n            reset()\n            include ${ABI_INCLUDE}\n            universalApk false\n        }\n    }" app/build.gradle

      - name: Build Android APK (split by ABI)
        working-directory: android
        run: ./gradlew assembleRelease --build-cache --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

      - name: Rename APKs with version and ABI
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.VERSION }}
          # Gradle splits 产出路径: app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk
          for apk in android/app/build/outputs/apk/release/*-release.apk; do
            abi=$(basename "$apk" | sed 's/app-\(.*\)-release\.apk/\1/')
            cp "$apk" "release/app-${abi}-v${VERSION}.apk"
            echo "Built: app-${abi}-v${VERSION}.apk"
          done
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v${{ steps.version.outputs.VERSION }}
          path: release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          NOTES="## Android APK Release\n\n### 版本信息\n- 版本号: v${VERSION}\n- 构建时间: ${{ github.event.head_commit.timestamp }}\n- 提交: ${{ github.sha }}\n\n### 下载\n- \`app-arm64-v8a-v${VERSION}.apk\` — 64位设备（推荐，大多数现代手机）"
          if [ "${{ inputs.build_armeabi_v7a || 'true' }}" = "true" ]; then
            NOTES="${NOTES}\n- \`app-armeabi-v7a-v${VERSION}.apk\` — 32位设备（老旧手机）"
          fi
          NOTES="${NOTES}\n\n### 安装说明\n1. 根据设备架构下载对应的APK文件\n2. 在Android设备上允许\"安装未知来源应用\"\n3. 安装并运行"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.release_notes.outputs.body }}
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
