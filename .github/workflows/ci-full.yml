name: CI Full

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check dependencies (expo install --check)
        run: npm run check-deps

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run tsc

      - name: Expo Doctor
        run: npx expo-doctor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Export web (dry-run)
        run: npx expo export --platform web --output dist --dump-sourcemap false || true

  eas-build:
    name: EAS Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS config
        run: cat eas.json

      - name: Expo version
        run: npx expo --version
