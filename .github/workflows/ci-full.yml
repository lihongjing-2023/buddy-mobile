name: CI Full

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: true
        default: true
        type: boolean
  
  # 定时触发：每天北京时间0点(UTC 16:00)检查前一天是否有更新
  schedule:
    - cron: '0 16 * * *'
  
  # PR时只运行质量检查，不构建APK
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check dependencies (expo install --check)
        run: npm run check-deps

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Export web (dry-run)
        run: npx expo export --platform web --output dist --dump-sourcemap false || true

  build-android:
    name: Build Android APK (Local)
    runs-on: ubuntu-latest
    # 手动触发 或 定时触发时检查前一天是否有commit
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_android == true) ||
      (github.event_name == 'schedule' && 
       github.event.schedule == '0 16 * * *')
    permissions:
      contents: write

    steps:
      - name: Check if there were commits in the last 24 hours
        id: check_commits
        if: github.event_name == 'schedule'
        run: |
          # 获取24小时前的日期
          ONE_DAY_AGO=$(date -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Checking commits since: $ONE_DAY_AGO"
          
          # 获取最近24小时的commit数量
          COMMIT_COUNT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits?since=$ONE_DAY_AGO&sha=main" | \
            jq length)
          
          echo "Commits in last 24 hours: $COMMIT_COUNT"
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$COMMIT_COUNT" -eq "0" ]; then
            echo "No commits in last 24 hours, skipping build"
            exit 78  # GitHub Actions的特殊退出码，表示跳过
          fi

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          build-tools: '34.0.0'
          ndk: '25.2.9519653'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION"

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Enable ABI split in build.gradle
        working-directory: android
        run: |
          # 在 android 块末尾注入 splits ABI 拆分配置（不使用 ndk.abiFilters，避免与 splits 冲突）
          sed -i '/^android {/a\    splits {\n        abi {\n            enable true\n            reset()\n            include "arm64-v8a", "armeabi-v7a"\n            universalApk false\n        }\n    }' app/build.gradle

      - name: Build Android APK (split by ABI)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APKs with version and ABI
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.VERSION }}
          # Gradle splits 产出路径: app-arm64-v8a-release.apk, app-armeabi-v7a-release.apk
          for apk in android/app/build/outputs/apk/release/*-release.apk; do
            abi=$(basename "$apk" | sed 's/app-\(.*\)-release\.apk/\1/')
            cp "$apk" "release/app-${abi}-v${VERSION}.apk"
            echo "Built: app-${abi}-v${VERSION}.apk"
          done
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v${{ steps.version.outputs.VERSION }}
          path: release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Android APK Release
            
            ### 版本信息
            - 版本号: v${{ steps.version.outputs.VERSION }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}
            
            ### 下载
            - `app-arm64-v8a-v${{ steps.version.outputs.VERSION }}.apk` — 64位设备（推荐，大多数现代手机）
            - `app-armeabi-v7a-v${{ steps.version.outputs.VERSION }}.apk` — 32位设备（老旧手机）
            
            ### 安装说明
            1. 根据设备架构下载对应的APK文件
            2. 在Android设备上允许"安装未知来源应用"
            3. 安装并运行
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
